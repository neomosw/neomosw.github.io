<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A portfolio by Neomosw.">
	<title>Neomosw — Portfolio</title>
	<style>
		:root {
			color-scheme: light;
			--paper: #f2f0ea;
			--ink: #1f2521;
			--muted: #72786f;
			--line: rgba(31, 37, 33, 0.16);
			--accent: #c9d8c1;
		}

		* {
			box-sizing: border-box;
		}

		html {
			min-height: 100%;
			background: var(--paper);
		}

		body {
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background:
				radial-gradient(circle at 78% 18%, rgba(201, 216, 193, 0.72), transparent 22rem),
				linear-gradient(135deg, rgba(255, 255, 255, 0.35), transparent 40%),
				var(--paper);
			font-family: Georgia, "Times New Roman", serif;
		}

		.page {
			display: grid;
			min-height: 100vh;
			padding: 2rem clamp(1.25rem, 5vw, 5rem) 1.5rem;
			grid-template-rows: auto 1fr auto;
		}

		.masthead,
		.footer {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
			font-family: "Trebuchet MS", Arial, sans-serif;
			font-size: 0.7rem;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		.masthead {
			padding-bottom: 1.25rem;
			border-bottom: 1px solid var(--line);
		}

		.mark {
			display: inline-flex;
			align-items: center;
			gap: 0.65rem;
			font-weight: 700;
		}

		.mark::before {
			display: block;
			width: 0.55rem;
			height: 0.55rem;
			content: "";
			border-radius: 50%;
			background: var(--ink);
		}

		.status {
			color: var(--muted);
		}

		main {
			display: grid;
			align-content: center;
			justify-items: center;
			padding: 5rem 0;
			text-align: center;
		}

		.empty-state {
			max-width: 35rem;
			animation: arrive 700ms ease-out both;
		}

		.eyebrow {
			margin: 0 0 1.5rem;
			color: var(--muted);
			font-family: "Trebuchet MS", Arial, sans-serif;
			font-size: 0.7rem;
			letter-spacing: 0.18em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(3.5rem, 11vw, 8rem);
			font-weight: 400;
			letter-spacing: -0.04em;
			line-height: 0.88;
		}

		.rule {
			width: 3.5rem;
			height: 1px;
			margin: 2rem auto;
			background: var(--ink);
		}

		.message {
			margin: 0;
			color: var(--muted);
			font-size: 1.05rem;
			line-height: 1.6;
		}

		.project-list {
			display: grid;
			width: min(100%, 58rem);
			margin: 5rem auto 0;
			border-top: 1px solid var(--line);
			text-align: left;
		}

		.project-slot {
			display: grid;
			grid-template-columns: 3rem 1fr auto;
			align-items: center;
			gap: 1rem;
			min-height: 4.75rem;
			border-bottom: 1px solid var(--line);
			font-family: "Trebuchet MS", Arial, sans-serif;
			font-size: 0.72rem;
			letter-spacing: 0.1em;
			text-transform: uppercase;
		}

		.project-number {
			color: var(--muted);
		}

		.project-name {
			color: var(--ink);
		}

		.project-state {
			color: var(--muted);
		}

		.footer {
			padding-top: 1.25rem;
			color: var(--muted);
			border-top: 1px solid var(--line);
		}

		.footer span:last-child {
			color: var(--ink);
		}

		@keyframes arrive {
			from {
				opacity: 0;
				transform: translateY(0.75rem);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@media (max-width: 520px) {
			.page {
				padding-top: 1.25rem;
			}

			.masthead,
			.footer {
				align-items: flex-start;
				flex-direction: column;
				gap: 0.5rem;
			}

			main {
				padding: 4rem 0;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.empty-state {
				animation: none;
			}
		}
	</style>
</head>
<body>
	<div class="page">
		<header class="masthead">
			<span class="mark">Neomosw</span>
			<span class="status">Portfolio / 2026</span>
		</header>

		<main>
			<section class="empty-state" aria-labelledby="page-title">
				<p class="eyebrow">A personal collection</p>
				<h1 id="page-title">Work in progress.</h1>
				<div class="rule" aria-hidden="true"></div>
				<p class="message">This space is being made ready for the work to come.</p>

				<div class="project-list" aria-label="Upcoming portfolio projects">
					<div class="project-slot">
						<span class="project-number">01</span>
						<span class="project-name">Project title</span>
						<span class="project-state">Soon</span>
					</div>
					<div class="project-slot">
						<span class="project-number">02</span>
						<span class="project-name">Project title</span>
						<span class="project-state">Soon</span>
					</div>
					<div class="project-slot">
						<span class="project-number">03</span>
						<span class="project-name">Project title</span>
						<span class="project-state">Soon</span>
					</div>
				</div>
			</section>
		</main>

		<footer class="footer">
			<span>Cool projects, soon</span>
			<span>neomosw.github.io</span>
		</footer>
	</div>
</body>
</html>
